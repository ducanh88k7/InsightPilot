[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightpilot"
version = "0.3.4"
description = "An autonomous data analyst agent with structured planning, evidence-based review, numeric verification, metric binding, and claim coverage auditing, and verification evaluation metrics."
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "openpyxl",
  "matplotlib",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
